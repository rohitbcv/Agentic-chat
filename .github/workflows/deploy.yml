name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: SSH deploy to production
    runs-on: ubuntu-latest

    steps:
      - name: SSH and run deploy script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 120s
          script: bash /root/AI_Automated_agent/Agentic-chat/deploy.sh
